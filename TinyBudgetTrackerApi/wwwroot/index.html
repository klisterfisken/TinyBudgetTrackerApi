<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <title></title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
    <link rel="manifest" href="/img/site.webmanifest">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <main>
        <section id="vecko-info">
            <p id="kvar-budget"></p>
            <p id="historik-meddelande"></p>
        </section>

        <section id="matare">
            <div class="dag" data-dag="0">
                <div class="dag-rubrik">
                    <span class="dag-namn">MÅNDAG</span>
                    <span class="belopp"></span>
                </div>
                <div class="bar">
                    <div class="fyll"></div>
                </div>
            </div>
            <div class="dag" data-dag="1">
                <div class="dag-rubrik">
                    <span class="dag-namn">TISDAG</span>
                    <span class="belopp"></span>
                </div>
                <div class="bar">
                    <div class="fyll"></div>
                </div>
            </div>
            <div class="dag" data-dag="2">
                <div class="dag-rubrik">
                    <span class="dag-namn">ONSDAG</span>
                    <span class="belopp"></span>
                </div>
                <div class="bar">
                    <div class="fyll"></div>
                </div>
            </div>
            <div class="dag" data-dag="3">
                <div class="dag-rubrik">
                    <span class="dag-namn">TORSDAG</span>
                    <span class="belopp"></span>
                </div>
                <div class="bar">
                    <div class="fyll"></div>
                </div>
            </div>
            <div class="dag" data-dag="4">
                <div class="dag-rubrik">
                    <span class="dag-namn">FREDAG</span>
                    <span class="belopp"></span>
                </div>
                <div class="bar">
                    <div class="fyll"></div>
                </div>
            </div>
            <div class="dag" data-dag="5">
                <div class="dag-rubrik">
                    <span class="dag-namn">LÖRDAG</span>
                    <span class="belopp"></span>
                </div>
                <div class="bar">
                    <div class="fyll"></div>
                </div>
            </div>
            <div class="dag" data-dag="6">
                <div class="dag-rubrik">
                    <span class="dag-namn">SÖNDAG</span>
                    <span class="belopp"></span>
                </div>
                <div class="bar">
                    <div class="fyll"></div>
                </div>
            </div>
        </section>

        <section id="inmatning">
            <input type="number" id="belopp-input" placeholder="Belopp i kr" />
            <button id="lagg-till">Lägg till</button>
            <button id="historik-knapp">Historik</button>
        </section>
    </main>

    <div id="historik-ovarlay">
        <div id="historik-modal">
            <h2 id="historik-vecka"></h2>
            <ul id="historik-lista"></ul>
            <div id="historik-footer">
                <p>Bankat: <span id="historik-bankat"></span></p>
                <p>Totalt bankat: <span id="historik-totalt-bankat"></span></p>
            </div>
            <button id="historik-pil-vanster">◀</button>
            <button id="historik-pil-hoger">▶</button>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/render.js"></script>
    <script src="/js/historik.js"></script>
    <script src="/js/app.js"></script>
</body>

</html>
